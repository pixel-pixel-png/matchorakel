<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#212121">
  <meta name="description" content="Fråga Matchorakel om fotboll, matchstatistik och prognoser.">
  <meta property="og:title" content="Matchorakel">
  <title>Matchorakel</title>
  <link rel="icon" href="{{ url_for('static', filename='favicon.svg') }}" type="image/svg+xml">
  <link rel="preload" href="{{ url_for('static', filename='fonts/InterVariable.woff2') }}" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <div class="app-shell">
    <button class="mobile-scrim" id="scrim" aria-label="Stäng sidopanel" tabindex="-1" hidden></button>
    <aside class="sidebar" id="sidebar" aria-label="Chattar">
      <div class="sidebar-top">
        <button class="brand" id="brandHome" type="button">Matchorakel</button>
        <button class="icon-button sidebar-close" id="closeSidebar" type="button" aria-label="Stäng sidopanel">×</button>
      </div>
      <button class="new-chat" id="newChat" type="button"><span aria-hidden="true">+</span> Ny chatt</button>
      <div class="quick-links">
        <button id="openMatches" type="button">Matcher och favoritlag</button>
        <button id="openData" type="button" hidden>Uppdatera data</button>
      </div>
      <label class="sr-only" for="searchConversations">Sök i chattar</label>
      <input id="searchConversations" class="conversation-search" placeholder="Sök i chattar" autocomplete="off">
      <nav id="conversations" class="conversations" aria-label="Tidigare chattar"></nav>
      <div class="undo-toast" id="undoToast" role="status" hidden></div>
      <a class="report-link" href="/evaluation">Modellresultat</a>
      <button class="report-link" id="openAbout" type="button">Om Matchorakel</button>
    </aside>
    <div class="workspace is-empty">
      <header class="topbar">
        <button id="openSidebar" class="icon-button" type="button" aria-label="Visa eller dölj sidopanel" aria-controls="sidebar" aria-expanded="true"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M9 4v16"/></svg></button>
        <span class="topbar-title">Matchorakel</span>
      </header>
      <main class="chat-scroller" id="chat" aria-label="Konversation">
        <div class="chat-content" id="chatContent"></div>
      </main>
      <button id="scrollBottom" class="icon-button scroll-bottom" aria-label="Till senaste meddelandet" hidden>↓</button>
      <div class="composer-area">
        <p class="welcome-line" id="welcomeLine">Vad vill du veta om fotboll?</p>
        <form id="composer" class="composer">
          <label class="sr-only" for="message">Skriv till Matchorakel</label>
          <textarea id="message" name="message" rows="1" maxlength="2000" autocomplete="off" placeholder="Fråga Matchorakel" required></textarea>
          <button id="sendButton" type="submit" aria-label="Skicka fråga" disabled><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 19V5m0 0-6 6m6-6 6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
        </form>
        <div id="followups" class="followups" aria-label="Föreslagen följdfråga"></div>
        <p class="composer-caption">Matchorakel kan göra fel. Prognoser är inga garantier.</p>
      </div>
      <dialog class="tool-panel" id="toolPanel" aria-labelledby="panelTitle">
        <div class="tool-panel-header"><h2 id="panelTitle">Matcher</h2><button id="closePanel" class="icon-button" type="button" aria-label="Stäng">×</button></div>
        <div id="panelBody" class="tool-panel-body"></div>
      </dialog>
      <div class="sr-only" id="announcer" role="status" aria-live="polite"></div>
    </div>
  </div>
  <script src="{{ url_for('static', filename='script.js') }}" defer></script>
</body>
</html>
