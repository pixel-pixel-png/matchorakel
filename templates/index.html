<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#212121">
  <meta name="description" content="Fråga Matchorakel om fotboll, matchstatistik och prognoser.">
  <meta property="og:title" content="Matchorakel">
  <title>Matchorakel</title>
  <link rel="icon" href="{{ url_for('static', filename='favicon.svg') }}" type="image/svg+xml">
  <link rel="preload" href="{{ url_for('static', filename='fonts/InterVariable.woff2') }}" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <div class="app-shell">
    <button class="mobile-scrim" id="scrim" aria-label="Stäng sidopanel" tabindex="-1" hidden></button>
    <aside class="sidebar" id="sidebar" aria-label="Chattar">
      <div class="sidebar-top">
        <button class="brand" id="brandHome" type="button">Matchorakel</button>
        <button class="icon-button sidebar-close" id="closeSidebar" type="button" aria-label="Stäng sidopanel"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg></button>
      </div>
      <button class="new-chat" id="newChat" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5H6a2 2 0 0 0-2 2v11a2 2 0 0 0 2 2h11a2 2 0 0 0 2-2v-6M14 5.5l4.5-2a1.5 1.5 0 0 1 2 2L18 10l-5 2 1-6.5Z"/></svg><span>Ny chatt</span></button>
      <div class="quick-links">
        <button id="openMatches" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 3v4M17 3v4M3 10h18M7 14h4M7 17h4"/></svg><span>Matcher och favoritlag</span></button>
        <button id="openData" type="button" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.5-5.8M20 4v5h-5M12 8v5l3 2"/></svg><span>Uppdatera data</span></button>
      </div>
      <div class="history-search"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 4.5 4.5"/></svg><label class="sr-only" for="searchConversations">Sök i chattar</label><input id="searchConversations" class="conversation-search" placeholder="Sök i chattar" autocomplete="off"></div>
      <nav id="conversations" class="conversations" aria-label="Tidigare chattar"></nav>
      <div class="undo-toast" id="undoToast" role="status" hidden></div>
      <a class="report-link" href="/evaluation"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19V5M4 19h16M8 15l4-4 3 2 5-6"/></svg><span>Modellresultat</span></a>
      <button class="report-link" id="openAbout" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 10.5v5.5m0-8v.1"/></svg><span>Om Matchorakel</span></button>
    </aside>
    <div class="workspace is-empty">
      <header class="topbar">
        <button id="openSidebar" class="icon-button" type="button" aria-label="Visa eller dölj sidopanel" aria-controls="sidebar" aria-expanded="true"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M9 4v16"/></svg></button>
        <span class="topbar-title">Matchorakel</span>
        <button id="newChatTop" class="icon-button topbar-new-chat" type="button" aria-label="Ny chatt"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5H6a2 2 0 0 0-2 2v11a2 2 0 0 0 2 2h11a2 2 0 0 0 2-2v-6M14 5.5l4.5-2a1.5 1.5 0 0 1 2 2L18 10l-5 2 1-6.5Z"/></svg></button>
      </header>
      <main class="chat-scroller" id="chat" aria-label="Konversation">
        <div class="chat-content" id="chatContent"></div>
      </main>
      <button id="scrollBottom" class="icon-button scroll-bottom" aria-label="Till senaste meddelandet" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v15m0 0 6-6m-6 6-6-6"/></svg></button>
      <div class="composer-area">
        <p class="welcome-line" id="welcomeLine">Vad vill du veta om fotboll?</p>
        <form id="composer" class="composer">
          <label class="sr-only" for="message">Skriv till Matchorakel</label>
          <textarea id="message" name="message" rows="1" maxlength="2000" autocomplete="off" placeholder="Fråga Matchorakel" required></textarea>
          <button id="sendButton" type="submit" aria-label="Skicka fråga" disabled><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 19V5m0 0-6 6m6-6 6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
        </form>
        <div id="followups" class="followups" aria-label="Föreslagen följdfråga"></div>
        <p class="composer-caption">Matchorakel kan göra fel. Prognoser är inga garantier.</p>
      </div>
      <dialog class="tool-panel" id="toolPanel" aria-labelledby="panelTitle">
        <div class="tool-panel-header"><h2 id="panelTitle">Matcher</h2><button id="closePanel" class="icon-button" type="button" aria-label="Stäng"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg></button></div>
        <div id="panelBody" class="tool-panel-body"></div>
      </dialog>
      <div class="sr-only" id="announcer" role="status" aria-live="polite"></div>
    </div>
  </div>
  <script src="{{ url_for('static', filename='script.js') }}" defer></script>
</body>
</html>
