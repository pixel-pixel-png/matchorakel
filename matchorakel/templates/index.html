<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f8f8f5">
  <title>Matchorakel — fotboll med perspektiv</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <div class="app-shell">
    <div class="mobile-scrim" id="scrim" hidden></div>
    <aside class="sidebar" id="sidebar" aria-label="Samtal">
      <div class="sidebar-top">
        <a class="brand" href="/" aria-label="Matchorakel, startsida"><span class="brand-icon">M<span class="brand-dot">.</span></span><span>matchorakel</span></a>
        <button class="icon-button sidebar-close" id="closeSidebar" type="button" aria-label="Stäng meny">×</button>
      </div>
      <button class="new-chat" id="newChat" type="button"><span class="plus-icon" aria-hidden="true">＋</span> Ny analys <span class="new-chat-arrow" aria-hidden="true">↗</span></button>
      <div class="quick-links">
        <button id="openMatches" type="button">▣ <span>Matcher och favoritlag</span></button>
        <button id="openData" type="button">↻ <span>Uppdatera data</span></button>
      </div>
      <div class="sidebar-section"><span>Senaste analyser</span></div>
      <label class="sr-only" for="searchConversations">Sök bland chattar</label>
      <input id="searchConversations" class="conversation-search" placeholder="Sök i chattar" autocomplete="off">
      <nav id="conversations" class="conversations" aria-label="Tidigare analyser"></nav>
      <div class="undo-toast" id="undoToast" role="status" hidden></div>
      <a class="report-link" href="/evaluation">Se modellernas resultat <span aria-hidden="true">↗</span></a>
      <div class="sidebar-bottom"><div class="live-dot" aria-hidden="true"></div><div><strong>Fem ligor · en chatt</strong><span>Ligan känns igen automatiskt</span></div></div>
    </aside>

    <div class="workspace">
      <header class="topbar">
        <div class="topbar-left"><button id="openSidebar" class="icon-button menu-button" type="button" aria-label="Öppna meny" aria-controls="sidebar" aria-expanded="false">☰</button><span class="topbar-title">Matchanalys</span><span class="topbar-divider"></span><span class="topbar-subtitle">Premier League · La Liga · Bundesliga · Serie A · Ligue 1</span></div>
        <span class="version-label"><span class="version-dot"></span> MATCHORAKEL / V10</span>
      </header>

      <main class="chat-scroller" id="chat" aria-live="polite" aria-relevant="additions">
        <div class="chat-content" id="chatContent"></div>
      </main>

      <div class="composer-area">
        <form id="composer" class="composer">
          <label class="sr-only" for="message">Skriv till chatten</label>
          <input id="message" name="message" maxlength="500" autocomplete="off" placeholder="Skriv till Matchorakel ..." required>
          <button id="sendButton" type="submit" aria-label="Skicka fråga"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 19V5m0 0-6 6m6-6 6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
        </form>
        <p class="composer-caption" id="chatCapability">Matchorakel · en chatt för alla frågor</p>
      </div>
      <section class="tool-panel" id="toolPanel" hidden aria-label="Verktyg">
        <div class="tool-panel-header"><h2 id="panelTitle">Matcher</h2><button id="closePanel" type="button" aria-label="Stäng panel">×</button></div>
        <div id="panelBody" class="tool-panel-body"></div>
      </section>
    </div>
  </div>
  <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
