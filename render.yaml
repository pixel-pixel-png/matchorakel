services:
  - type: web
    name: matchorakel
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python deploy_build.py
    startCommand: gunicorn --bind 0.0.0.0:$PORT --workers 1 --threads 2 --timeout 90 public_start:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.4
      - key: MATCHORAKEL_PUBLIC
        value: '1'
      - key: GROQ_API_KEY
        sync: false
